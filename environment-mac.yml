  - r-patchwork
  - r-seurat=4.*
  - bioconductor-singlecellexperiment
  - r-enrichr
  - r-leiden
  - r-matrix
  - python=3.10
  - leidenalg
  - python-igraph
  - pip

  - r-future
  - r-future.apply
  - r-pbapply
  - r-irlba
  - r-nmf
