# Conda environment for "Single Cell Bioinformatics" - Project 1 (scRNAseq)
# LINUX
#
# STRONGLY RECOMMENDED: use mamba instead of plain conda to create this.
# Plain conda's solver is extremely slow (can take a very long time, or
# appear to hang) on environments this size - mixing conda-forge, bioconda,
# and a big R/Bioconductor + tidyverse dependency graph. mamba uses a much
# faster solver and reads the exact same file:
#
#   conda install -n base -c conda-forge mamba   # one-time, if you don't have it
#   mamba env create -f environment-linux.yml
#   conda activate single-cell
#
# If you'd rather stick with plain conda, at least set strict channel
# priority first - this alone cuts solve time substantially:
#
#   conda config --set channel_priority strict
#   conda env create -f environment-linux.yml
#
# (You may see warnings like "Using .* with relational operator is
# superfluous and deprecated" during solving - these come from transitive
# dependency metadata already in the channels, not from this file, and are
# harmless. Ignore them.)
#
#
# (You will see two warnings during creation, on both a first install and a
# from-scratch rebuild after fully clearing the package cache - confirmed
# 2026-09-26. Both are benign and expected, not a broken environment:
#   - "SafetyError: ... r-base ... packages.html has an incorrect size" -
#     R's own post-install hooks rewrite lib/R/doc/html/packages.html (its
#     installed-package index) every time another R package is added, so it
#     naturally outgrows the pristine size conda recorded for r-base alone.
#     A known false-positive across R/conda-forge environments.
#   - "ClobberError: ... libgfortran-devel_osx-64 ... gfortran_impl_osx-64
#     ... ISO_Fortran_binding.h" - these two compiler-toolchain packages
#     legitimately ship the same header from the same conda-forge build
#     cycle; conda flags any shared path on principle, whether or not the
#     content actually conflicts (here it doesn't).
# Both times the transaction still completed ("Executing transaction: done")
# and R/Seurat/SingleCellExperiment loaded normally afterwards. Ignore them.
#
# macOS users: use environment-mac.yml instead (some Bioconductor packages
# below don't have native Apple Silicon builds).
# Windows users: see README-Windows.md - this must be run inside WSL2, not
# native Windows.
#
# This environment deliberately pins R 4.2 / Seurat 4.x rather than
# upgrading to latest: DoubletFinder (required below) has a known,
# unresolved break against Seurat v5's new Assay5 object structure
# (github.com/chris-mcginnis-ucsf/DoubletFinder/issues/171). Since the
# live Seurat docs online now document v5 syntax, point students to the
# version-matched v4.3 archive instead:
#   - Guided tutorial:   https://satijalab.org/seurat/archive/v4.3/pbmc3k_tutorial
#   - Command list:      https://satijalab.org/seurat/archive/v4.3/essential_commands
#   - Data integration:  https://satijalab.org/seurat/archive/v4.3/integration_introduction
#   - Full archive index: https://satijalab.org/seurat/articles/archive
#
# UPDATING AN EXISTING ENVIRONMENT (e.g. adding CellChat below to a cluster
# or laptop env you already created): do NOT just `mamba install` the new
# package names on their own - the solver can decide to satisfy them by
# upgrading r-base/r-seurat, exactly like the earlier Banksy/SeuratWrappers
# issue. Always re-pin explicitly, e.g.:
#
#   mamba install -n single-cell \
#     r-future r-future.apply r-pbapply r-irlba r-nmf r-ggalluvial r-stringr \
#     r-svglite r-expm r-rtsne r-ggrepel r-circlize r-rcolorbrewer r-cowplot \
#     bioconductor-complexheatmap r-rspectra r-rcpp r-rcppeigen r-reticulate \
#     r-scales r-sna r-reshape2 r-fnn r-shape bioconductor-biocgenerics \
#     r-colorspace r-plyr r-ggpubr r-ggnetwork bioconductor-biocneighbors \
#     "r-base=4.2*" "r-seurat=4.*"
#
# then read the proposed transaction before confirming: it should show only
# new installs, zero "Upgrade" lines for r-base or r-seurat. If it proposes
# upgrading either, stop and don't confirm.

name: single-cell
channels:
  - conda-forge
  - bioconda
  - defaults

dependencies:
  - r-base=4.2
  - r-devtools
  - r-remotes
  - r-biocmanager
  - r-tidyverse
  # dbplyr pinned to 2.3.4 (confirmed 2026-10-08): with conda-forge's
  # r-dbplyr 2.5.0 (and still with 2.4.0), BiocFileCache 2.6.1 (Bioconductor 3.16, the version that
  # matches R 4.2) fails when celldex/ExperimentHub open the download cache,
  # e.g. in HumanPrimaryCellAtlasData(): "Failed to collect lazy table ...
  # Arguments in `...` must be used ... ..1 = Inf". The fixed BiocFileCache
  # versions need R >= 4.3, so dbplyr is held back instead. Fix for an
  # existing env (then restart R):
  #   mamba install -n <env> "r-dbplyr=2.3.4" "r-base=4.2*" "r-seurat=4.*"
  - r-dbplyr=2.3.4
  # matrixStats pinned to 1.1.0 (confirmed 2026-10-08): from matrixStats
  # 1.2.0 on, useNames = NA is defunct, but the Bioconductor 3.16 packages
  # used by SingleR still pass it, so SingleR() fails with "useNames = NA is
  # defunct". With 1.1.0 this is only a (harmless) deprecation warning.
  # Fix for an existing env (then restart R):
  #   mamba install -n <env> "r-matrixstats=1.1.0" "r-base=4.2*" "r-seurat=4.*"
  - r-matrixstats=1.1.0
  - r-dplyr
  - r-patchwork
  - r-seurat=4.*
  - bioconductor-singlecellexperiment
  - bioconductor-singler
  - bioconductor-celldex
  - r-enrichr
  - r-leiden
  - r-matrix
  - python=3.10
  - leidenalg
  - python-igraph
  - pip

  # --- CellChat dependencies (Week 4, Sec 10 "Cell-Cell Communication") ---
  # CellChat itself (sqjin/CellChat) is GitHub-only and installed manually
  # below, but its ~25 CRAN/Bioconductor Imports are all available as conda
  # packages, so they're pulled in here to avoid slow/fragile from-source
  # compiles (same approach that worked for the Banksy dependency chain).
  # List taken directly from CellChat 1.6.1's DESCRIPTION (Imports field).
  - r-future
  - r-future.apply
  - r-pbapply
  - r-irlba
  - r-nmf
  - r-ggalluvial
  - r-stringr
  - r-svglite
  - r-expm
  - r-rtsne
  - r-ggrepel
  - r-circlize
  - r-rcolorbrewer
  - r-cowplot
  - bioconductor-complexheatmap
  - r-rspectra
  - r-rcpp
  - r-rcppeigen
  - r-reticulate
  - r-scales
  - r-sna
  - r-reshape2
  - r-fnn
  - r-shape
  - bioconductor-biocgenerics
  - r-colorspace
  - r-plyr
  - r-ggpubr
  - r-ggnetwork
  - bioconductor-biocneighbors

  # --- Monocle3 dependencies (Week 4, Sec 9 "Trajectory Analysis") ---
  # Pinning monocle3 to release v1.3.1 (not latest/master): the current
  # official docs state monocle3 >= 1.4.25 needs R >= 4.4.1 (it added a
  # dependency on BPCells, a newer package). v1.3.1 predates BPCells, only
  # declares R >= 4.0.0, and uses terra instead - compatible with this R 4.2
  # / Seurat 4.x environment. Below are v1.3.1's conda-installable deps.
  - bioconductor-biobase
  - bioconductor-s4vectors
  - bioconductor-summarizedexperiment
  - bioconductor-delayedarray
  - bioconductor-delayedmatrixstats
  - bioconductor-hdf5array
  - bioconductor-batchelor
  - bioconductor-limma
  - r-assertthat
  - r-digest
  - r-ggrastr
  - r-grr
  - r-lme4
  - r-lmtest
  - r-mass
  - r-openssl
  - r-pbmcapply
  - r-pheatmap
  - r-plotly
  - r-proxy
  - r-pscl
  - r-rann
  - r-rcppannoy
  - r-rhpcblasctl
  - r-rsample
  - r-shiny
  - r-slam
  - r-spdep
  - r-speedglm
  - r-uwot
  - r-viridis
  # terra's own conda-forge R package (r-terra) has, like r-nmf, dropped R
  # 4.2 support - only the underlying C libraries are pulled in here, and
  # terra itself is compiled from CRAN source against them in the manual
  # block below (same fix pattern as the NMF issue).
  - gdal
  - geos
  - proj
  - sqlite

# The following are GitHub-only / archived-CRAN packages with no conda build
# and must be installed from inside R after activating the environment:
#
#   conda activate single-cell
#   R
#
#   devtools::install_github("chris-mcginnis-ucsf/DoubletFinder")
#
#   # Pinned to commit 729c31edf3 (SeuratWrappers 0.3.0, Dec 2021), NOT the
#   # default master branch: master (SeuratWrappers >= 0.4.0) hard-requires
#   # Seurat >= 5.0.0 and Banksy (which itself requires R >= 4.4), both
#   # incompatible with this R 4.2 / Seurat 4.x environment. 729c31edf3 only
#   # requires Seurat >= 3.0.1 and is the commit that fixed as.cell_data_set()
#   # for monocle3 1.x. Do NOT use the older "community-vignette" branch
#   # (SeuratWrappers 0.2.0): its as.cell_data_set() fails with monocle3 1.3.1
#   # with "no slot of name 'preprocess_aux'" (confirmed 2026-10-14).
#   remotes::install_github("satijalab/seurat-wrappers@729c31edf3", upgrade = "never")
#
#   # CellChat needs NMF >= 0.23.0, but conda-forge's r-nmf feedstock has
#   # dropped R 4.2 support - its newest R4.2-tagged ("r42") build is still
#   # stuck at 0.21.0, which is too old and makes CellChat fail to load with
#   # "namespace 'NMF' 0.21.0 is being loaded, but >= 0.23.0 is required".
#   # Fix: swap conda's NMF for a fresh one built from CRAN source (NMF only
#   # requires R >= 3.0.0, so this is safe - it's a conda packaging gap, not
#   # a real R 4.2 incompatibility). NMF's own deps (pkgmaker, registry,
#   # rngtools, doParallel, foreach) are already installed via conda above,
#   # so this is just a quick source rebuild of the one package.
#   remove.packages("NMF")
#   install.packages("NMF")
#
#   # CellChat (GitHub-only, no CRAN/Bioconductor release). Version 1.6.1's
#   # DESCRIPTION only Suggests Seurat (>= 4.0.0) - unlike Banksy/SeuratWrappers
#   # master, it does NOT hard-require Seurat 5, so it installs cleanly on
#   # this R 4.2 / Seurat 4.x environment with no branch pinning needed.
#   devtools::install_github("sqjin/CellChat")
#
#   # Monocle3 (Week 4, Sec 9). Pinned to v1.3.1 - see the dependencies
#   # comment above for why (avoids the current release's R >= 4.4.1
#   # requirement). leidenbase is needed first. Use 0.1.37 from CRAN (only
#   # needs R >= 3.5; conda-forge has no R 4.2 build of it): the older
#   # GitHub tag v0.1.9 is incompatible with conda's igraph 2.0 and makes
#   # cluster_cells() fail with "REAL() can only be applied to a 'numeric',
#   # not a 'NULL'" (confirmed on macOS 2026-10-14). terra is installed from
#   # CRAN source rather than conda (r-terra has dropped R 4.2 support the
#   # same way r-nmf did) - it compiles here against the gdal/geos/proj C
#   # libraries installed via conda above (see the IMPORTANT note below).
#   # monocle3 comes from the course fork: release v1.3.1 plus one backported
#   # upstream fix (commit 42fc8c4 from monocle3 1.4.14). Plain v1.3.1 fails
#   # in cluster_cells() with igraph >= 2.0: "Adjacency matrix should be
#   # symmetric to produce an undirected graph".
#   remotes::install_version("leidenbase", version = "0.1.37", upgrade = "never")
#   install.packages("terra")
#   remotes::install_github("scb-icbb/monocle3@v1.3.1-igraph2", upgrade = "never")
#
#   # IMPORTANT (correction, confirmed 2026-09-27): plain
#   # install.packages("terra") above WILL fail here too, not just on Apple
#   # Silicon Macs as this note used to assume. The failure is an Rcpp
#   # Modules constructor-arity mismatch: terra's RcppModule.cpp declares an
#   # 11-argument constructor for SpatRaster (8-argument for
#   # SpatRasterStack), but conda's r-rcpp package only generates overloads
#   # up to yes_arity<7>. This is a conda-forge Rcpp packaging gap, not a
#   # macOS dyld/rpath issue - it is platform-independent and hits Linux
#   # identically (same compile error, same yes_arity<7> ceiling). Fix (same
#   # root cause as step 2 of 4 in environment-mac.yml's terra section, but
#   # this is the ONLY step needed on Linux - no gdal-config wrapper or
#   # rpath dedup required here, since GDAL/PROJ/GEOS linked cleanly and
#   # Linux's dynamic linker doesn't reject duplicate rpath entries the way
#   # macOS dyld does):
#   #
#   #   remove.packages("Rcpp")
#   #   install.packages("Rcpp")
#   #   install.packages("terra")
#   #
#   # Cluster/NFS gotcha (seen on a compute cluster, 2026-09-27): the
#   # remove.packages("Rcpp") step can leave the library's Rcpp directory
#   # non-empty (an NFS "silly-rename" leftover from a file still open
#   # elsewhere), which then makes install.packages("Rcpp") fail with
#   # "mv: cannot move ... Directory not empty". If you hit that, first
#   # confirm no other R process is running (ps -u $(whoami) | grep -i R),
#   # then from a shell - not inside R - force-clear it and retry:
#   #
#   #   rm -rf $(Rscript -e 'cat(.libPaths()[1])')/Rcpp
#   #   rm -rf $(Rscript -e 'cat(.libPaths()[1])')/00LOCK-Rcpp
#   #
#   # then back in R: install.packages("Rcpp") followed by
#   # install.packages("terra") again.
#
#   # only if Seurat's clustering functions error out:
#   remove.packages(grep("spatstat", installed.packages(), value = TRUE))
#   devtools::install_version("spatstat", version = "2.4.4")
#   install.packages("Matrix", ".", type = "source",
#                     repos = "http://R-Forge.R-project.org")
